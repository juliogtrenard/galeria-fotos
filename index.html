<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Galeria de fotos</title>
  </head>
  <body>
    <!-- Zona de navegación con busqueda de imágenes y favoritos -->
    <header class="nav">
      <nav class="nav__container">
        <h1 class="nav__titulo">Pexels</h1>

        <form class="nav__busqueda">
          <input
            type="search"
            id="search"
            name="search"
            placeholder="Buscar imágenes..."
          />
          <button class="nav__search-btn" type="submit">Buscar</button>
        </form>

        <button class="nav__fav-btn" type="button">🌟​ Favoritos</button>
      </nav>
    </header>

    <!-- Zona donde se mostrarán las categorías -->
    <main>
      <section class="galeria">
        <!-- Aquí se cargarán las imágenes de forma dinámica -->
      </section>
    </main>

    <!-- Script -->
    <script src="js/main.js"></script>
  </body>
</html>
